<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Poster Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <!-- LEFT SIDEBAR: Controls -->
    <aside class="sidebar">
        <h2>🎨 Customize Panel</h2>
        
        <div class="control-group">
            <label>Background Color:</label>
            <input type="color" id="bgColor" value="#2c3e50">
        </div>

        <div class="control-group">
            <label>Poster Title:</label>
            <input type="text" id="titleText" value="DYNAMIC POSTER">
        </div>
        
        <div class="control-group">
            <label>Font Size:</label>
            <input type="range" id="fontSize" min="20" max="100" value="50">
        </div>

        <button id="downloadBtn">📥 Download Master SVG</button>
    </aside>

    <!-- RIGHT MAIN: Canvas Area -->
    <main class="canvas-area">
        <!-- The SVG element is our "Canvas" -->
        <svg id="posterCanvas" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
            <rect id="bgRect" width="100%" height="100%" fill="#2c3e50" />
            <text id="mainText" x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="50" fill="#ffffff">
                DYNAMIC POSTER
            </text>
            <!-- You can add complex SVG shapes, waves, and patterns here -->
        </svg>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
